name: Nightly deploy

# Rebuilds production from the Sheet once a day, so changes made outside the
# Sheet's Publish button (e.g. scripts writing via the API) still go live.
# Needs the VERCEL_DEPLOY_HOOK_URL repo secret; skips quietly without it.

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC, early morning in the US
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
